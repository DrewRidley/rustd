[package]
name = "rustd"
version = "0.0.0"
description = "Spike: persistent compiler on top of rust-analyzer's database"
publish = false

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
memchr = "2"
anyhow.workspace = true
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
cfg.workspace = true
intern.workspace = true
memmap2 = "0.9"
wasmparser = { version = "0.236", default-features = false, features = ["std"] }
wasm-encoder = { version = "0.244", default-features = false, features = ["std"] }
mimalloc = { version = "0.1.46", default-features = false }
object = { version = "0.37", default-features = false, features = ["read", "std", "archive", "elf", "macho", "coff", "pe", "wasm"] }
rustc-demangle = "0.1.28"
rustc-hash.workspace = true
same-file = "1"
dunce = "1"
pdb = "0.8"
sha2 = "0.10"
cargo_metadata.workspace = true
shlex = "2"
toml.workspace = true

hir.workspace = true
hir-def.workspace = true
hir-ty.workspace = true
ide-db.workspace = true
load-cargo.workspace = true
project-model.workspace = true
vfs.workspace = true
triomphe.workspace = true
paths.workspace = true
syntax.workspace = true
# Without the features that bring a second HTTP and TLS stack (`rustls`), a C library built
# with cmake (`default-https-client`, which is aws-lc) and SigV4A. The client is hyper 1 over
# rustls with ring, which is in the tree already.
aws-config = { version = "1.8", default-features = false, features = ["behavior-version-latest", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.100", default-features = false, features = ["behavior-version-latest", "rt-tokio", "http-1x"] }
aws-smithy-http-client = { version = "1.1", features = ["rustls-ring"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "fs", "io-util", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ed25519-dalek = "2.2"
getrandom = "0.3"
url.workspace = true
tar = "0.4.44"
zstd = "0.13.3"
tikv-jemallocator = { version = "0.5.4", optional = true, features = ["profiling"] }
tikv-jemalloc-ctl = { version = "0.5.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
uds_windows = "1"

[features]
# Allocate with jemalloc, which can profile the heap: see `memory.rs`.
heap-profile = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

# Adds LLVM as a code producer, chosen with `RUSTD_BACKEND=llvm`.
llvm = ["hir-ty/llvm"]

[lints]
workspace = true
